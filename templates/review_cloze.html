{% extends 'base.html' %}
{% block content %}

<style>
/* 1. Conteneur principal */
#verso-cloze-container {
    font-size: 1.2em;
    line-height: 2.3;
    color: #2d3748 !important;
    background: #ffffff;
    padding: 10px;
    word-break: break-word;
}

.card-bold-text {
    color: #6b46c1;
    font-weight: 700;
}

/* 2. Champ à trou : forçage du fond transparent et du texte lisible */
.cloze-input,
.cloze-input:not(:focus) {
    background-color: transparent !important;
    background: transparent !important;
    color: #2b6cb0 !important; /* Couleur du texte saisi (Bleu doux) */
    font-size: 1em !important;
    font-family: inherit;
    font-weight: 600;
    
    /* Bordure du bas uniquement */
    border: none !important;
    border-bottom: 2px dashed #a0aec0 !important;
    border-radius: 0 !important;
    
    padding: 2px 4px;
    margin: 0 4px;
    text-align: center;
    outline: none !important;
    box-shadow: none !important;
    
    vertical-align: baseline;
    display: inline-block;
    transition: all 0.2s ease;
}

/* Style du texte indicatif (placeholder) si présent */
.cloze-input::placeholder {
    color: #a0aec0 !important;
    opacity: 0.7;
}

/* 3. Au survol */
.cloze-input:hover {
    border-bottom-color: #4a5568 !important;
    background-color: rgba(237, 242, 247, 0.5) !important;
}

/* 4. Quand on clique / tape dedans (Focus) */
.cloze-input:focus {
    border-bottom: 2px solid #3182ce !important;
    background-color: #ebf8ff !important;
    color: #2b6cb0 !important;
}

/* 5. État Valide (Vert) */
.cloze-input.valid {
    border-bottom: 2px solid #38a169 !important;
    color: #276749 !important;
    background-color: #c6f6d5 !important;
    font-weight: 700;
}

/* 6. État Invalide (Rouge) */
.cloze-input.invalid {
    border-bottom: 2px solid #e53e3e !important;
    color: #9b2c2c !important;
    background-color: #fed7d7 !important;
    animation: shake 0.3s ease-in-out;
}

@keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-3px); }
    40%, 80% { transform: translateX(3px); }
}
</style>

<div style="text-align: center; max-width: 650px; margin: 0 auto;" id="main-container">
    
    <!-- EN-TÊTE -->
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #a0aec0;">
        <span>Progression : <strong id="progress-text">1 / 1</strong></span>
        <a href="{{ url_for('view_collection', collection_id=collection.id) }}" onclick="saveSessionData()" style="color: #e53e3e; text-decoration: none; font-weight: bold;">✕ Quitter</a>
    </div>

    <h2 style="margin-bottom: 25px;">TEXTE À TROUS - {{ collection.name }}</h2>

    <!-- CARTE PRINCIPALE -->
    <button type="button" id="btn-prev-card" onclick="prevCard(event)" style="display: none;">&lt;</button>
    
    <div style="background: #ffffff; color: #1a202c; border-radius: 30px; padding: 30px; min-height: 250px; 
    display: flex; flex-direction: column; justify-content: center; position: relative; 
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); margin-bottom: 20px;">
        
        <button id="star-btn" type="button" onclick="toggleDifficult(event)" style="position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 2em; cursor: pointer; color: #cbd5e0;">
            ★
        </button>
        
        <!-- RECTO -->
        <div id="recto-text" style="font-size: 1.2em; font-weight: bold; text-transform: uppercase; margin-bottom: 15px;">
            Chargement...
        </div>
        
        <hr style="border: 0; border-top: 1px dashed #cbd5e0; margin: 15px 0;">

        <!-- VERSO AVEC TROUS OU RÉCAPITULATIF -->
        <form id="cloze-form" onsubmit="checkAnswers(event)" style="font-size: 1.1em; color: #2d3748; line-height: 1.8;">
            <div id="verso-cloze-container"></div>
            <button type="submit" id="submit-btn" style="margin-top: 20px; background: #805ad5; color: white; border: none; padding: 12px 24px; border-radius: 12px; font-weight: bold; font-size: 1em; cursor: pointer;">
                Valider
            </button>
        </form>

        <!-- RECAPITULATIF APPRÈS VALIDATION -->
        <div id="recap-box" style="display: none; margin-top: 15px; text-align: left; background: #f7fafc; padding: 15px; border-radius: 12px; border: 1px solid #e2e8f0;">
            <p style="margin: 0 0 10px 0; font-weight: bold; color: #4a5568;">Réponse attendue :</p>
            <div id="expected-answer-display" style="color: #2d3748; font-size: 1.05em; margin-bottom: 15px;"></div>
            <p style="margin: 0 0 5px 0; font-weight: bold; color: #4a5568;">Vos réponses :</p>
            <div id="user-answers-display" style="font-size: 1em;"></div>
        </div>
    </div>
</div>

<script>
let cards = [];
let currentIndex = 0;
const startTime = Date.now();
let cardsViewed = 0;
let cardsSuccess = 0;
let sessionSaved = false;
let isAnswered = false;
let readyForNext = false;
let currentTargets = [];

const reviewSource = "{{ source }}";

function escapeHtml(text) {
    const div = document.createElement('div');
    div.innerText = text || '';
    return div.innerHTML;
}

function parseMarkdownBold(text) {
    const safeText = escapeHtml(text);
    return safeText.replace(/\*(.*?)\*/g, '<strong class="card-bold-text">$1</strong>');
}

const defNormalize = (str) => {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
};

// Vérification de la validité d'un mot (Logique du mode Write)
function validateWord(userInputRaw, expectedRaw) {
    const rawOptions = expectedRaw.split('|').map(s => s.trim());
    const possibleAnswers = [];
    
    for (const opt of rawOptions) {
        const stripped = opt.replace(/\s*\([^)]*\)/g, '').trim();
        if (stripped) possibleAnswers.push(stripped);
        if (opt !== stripped) possibleAnswers.push(opt);
    }

    for (const option of possibleAnswers) {
        const userWords = userInputRaw.split(/\s+/).filter(Boolean);
        const expectedWords = option.split(/\s+/).filter(Boolean);

        if (userWords.length !== expectedWords.length) continue;

        let match = true;
        for (let i = 0; i < expectedWords.length; i++) {
            const uWord = userWords[i].toLowerCase();
            const eWord = expectedWords[i].toLowerCase();

            const uWordNoAccents = defNormalize(uWord);
            const eWordNoAccents = defNormalize(eWord);

            if (uWord === uWordNoAccents) {
                if (uWordNoAccents !== eWordNoAccents) { match = false; break; }
            } else {
                if (uWord !== eWord) { match = false; break; }
            }
        }
        if (match) return true;
    }
    return false;
}

document.addEventListener("DOMContentLoaded", function() {
    fetch('/collection/{{ collection.id }}/data')
        .then(res => res.json())
        .then(data => {
            let allCards = data.cards;

            // Filtre : Ne garder que les cartes contenant du texte en gras dans le Verso
            let clozeCards = allCards.filter(c => c.answer && /\*(.*?)\*/.test(c.answer));

            if (reviewSource === 'not_validated') {
                cards = clozeCards.filter(c => c.is_known !== 1);
            } else if (reviewSource === 'difficult') {
                cards = clozeCards.filter(c => c.is_difficult === 1);
            } else {
                cards = clozeCards;
            }

            cards.sort(() => Math.random() - 0.5);

            if (cards.length > 0) {
                renderCard();
            } else {
                document.getElementById('recto-text').innerText = "Aucune carte à trou disponible pour ce filtre ! 🎉";
                document.getElementById('cloze-form').style.display = 'none';
            }
        });

    document.addEventListener("click", function(e) {
        if (readyForNext && e.target.id !== 'star-btn' && e.target.tagName !== 'INPUT') {
            nextCard();
        }
    });

    document.addEventListener("keydown", function(e) {
        if (readyForNext) {
            e.preventDefault();
            nextCard();
        }
    });
});

function renderCard() {
    if (currentIndex >= cards.length) {
        saveSessionData();
        alert("Session de révision terminée ! 🎉");
        window.location.href = "{{ url_for('view_collection', collection_id=collection.id) }}";
        return;
    }

    isAnswered = false;
    readyForNext = false;
    currentTargets = [];

    // Affichage des éléments basés sur TES ID HTML
    const clozeForm = document.getElementById("cloze-form");
    const submitBtn = document.getElementById("submit-btn");
    const recapBox = document.getElementById("recap-box");

    if (clozeForm) clozeForm.style.display = "block";
    if (submitBtn) submitBtn.style.display = "inline-block";
    if (recapBox) recapBox.style.display = "none";

    const card = cards[currentIndex];
    
    // Mise à jour de la question (Recto)
    const rectoEl = document.getElementById("recto-text");
    if (rectoEl) rectoEl.innerHTML = parseMarkdownBold(card.question);

    // Injection dynamique dans TON conteneur "verso-cloze-container"
    const container = document.getElementById("verso-cloze-container");
    if (container) {
        container.innerHTML = "";

        const parts = card.answer.split(/(\*.*?\*)/g);
        let inputIdx = 0;

        parts.forEach(part => {
            if (part.startsWith('*') && part.endsWith('*')) {
                const targetWord = part.slice(1, -1);
                currentTargets.push(targetWord);

                const input = document.createElement("input");
                input.type = "text";
                input.className = "cloze-input";
                input.dataset.index = inputIdx;
                
                // Calcul de taille ajusté pour le nouveau design
                const minWidth = Math.max(90, targetWord.length * 11 + 20);
                input.style.width = `${minWidth}px`;
                
                input.autocomplete = "off";
                input.spellcheck = false;

                container.appendChild(input);
                inputIdx++;
            } else {
                const span = document.createElement("span");
                span.innerText = part;
                container.appendChild(span);
            }
        });

        // Focus auto sur le premier champ
        setTimeout(() => {
            const firstInput = container.querySelector('input');
            if (firstInput) firstInput.focus();
        }, 50);
    }

    // Gestion de l'étoile (Favoris/Difficile)
    const starBtn = document.getElementById("star-btn");
    if (starBtn) {
        starBtn.style.color = card.is_difficult === 1 ? "#f6ad55" : "#cbd5e0";
    }

    // Indicateur de progression
    const progressEl = document.getElementById("progress-text");
    if (progressEl) {
        progressEl.innerText = `${currentIndex + 1} / ${cards.length}`;
    }
}

function checkAnswers(event) {
    event.preventDefault();
    if (isAnswered) return;

    const inputs = document.querySelectorAll('.cloze-input');
    let allValid = true;
    let userAnswersSummary = [];

    inputs.forEach((input, i) => {
        const userVal = input.value.trim();
        const expectedVal = currentTargets[i];
        const isValid = validateWord(userVal, expectedVal);

        if (isValid) {
            input.classList.add('valid');
        } else {
            input.classList.add('invalid');
            allValid = false;
        }

        userAnswersSummary.push(`
            <span style="color: ${isValid ? '#38a169' : '#e53e3e'}; font-weight: bold;">
                Trou ${i + 1} : ${escapeHtml(userVal) || '<i>(vide)</i>'} ${isValid ? '✓' : '✗'}
            </span>
        `);
    });

    cardsViewed++;
    const card = cards[currentIndex];

    if (allValid) {
        cardsSuccess++;
        card.is_known = 1;
        fetch(`/card/${card.id}/answer`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ knows: 1 })
        });
    }

    // Affichage de la page de récapitulatif
    document.getElementById("submit-btn").style.display = "none";
    document.getElementById("expected-answer-display").innerHTML = parseMarkdownBold(card.answer);
    document.getElementById("user-answers-display").innerHTML = userAnswersSummary.join('<br>');
    document.getElementById("recap-box").style.display = "block";

    isAnswered = true;
    setTimeout(() => { readyForNext = true; }, 150);
}

function nextCard() {
    currentIndex++;
    renderCard();
}

function toggleDifficult(e) {
    e.stopPropagation();
    const card = cards[currentIndex];
    card.is_difficult = card.is_difficult === 1 ? 0 : 1;
    document.getElementById("star-btn").style.color = card.is_difficult === 1 ? "#f6ad55" : "#cbd5e0";
    fetch(`/card/${card.id}/toggle_difficult`, { method: 'POST' });
}

function saveSessionData() {
    if (sessionSaved) return;
    const durationSeconds = Math.round((Date.now() - startTime) / 1000);
    if (cardsViewed === 0 || durationSeconds < 2) return;

    const payload = JSON.stringify({
        collection_id: parseInt("{{ collection.id }}"),
        mode: "cloze",
        duration_seconds: durationSeconds,
        cards_viewed: cardsViewed,
        cards_success: cardsSuccess
    });

    navigator.sendBeacon('/api/study_session', payload);
    sessionSaved = true;
}

window.addEventListener('beforeunload', saveSessionData);
</script>
{% endblock %}
