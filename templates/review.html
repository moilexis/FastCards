{% extends 'base.html' %}
{% block content %}
<div style="text-align: center; max-width: 600px; margin: 0 auto;">
    
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; color: #a0aec0;">
        <span>Progression : <strong>{{ progress[0] }} / {{ progress[1] }}</strong></span>
        <a href="{{ url_for('view_collection', collection_id=collection.id) }}" style="color: #e53e3e; text-decoration: none; font-weight: bold;">✕ Quitter</a>
    </div>

    <h2 style="margin-bottom: 25px;">COLLECTION - REVISER</h2>

    <!-- CONTAINER GRANDE CARTE -->
    <div style="background: #ffffff; color: #1a202c; border-radius: 30px; padding: 40px; min-height: 250px; 
    display: flex; flex-direction: column; justify-content: center; position: relative; 
    box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3); margin-bottom: 40px; margin-left: 40px; margin-right: 40px;">
        
        <!-- Étoile Cliquable Difficile du coin supérieur gauche -->
        <form method="POST" style="position: absolute; top: 20px; left: 25px;">
            <input type="hidden" name="action" value="toggle_difficult_review">
            {% if card.is_difficult == 1 %}
                <button type="submit" style="background: none; border: none; font-size: 2.2em; cursor: pointer; color: #f6ad55; transition: transform 0.1s;" title="Marquer comme difficile">
            {% else %}
                <button type="submit" style="background: none; border: none; font-size: 2.2em; cursor: pointer; color: #cbd5e0; transition: transform 0.1s;" title="Marquer comme difficile">
            {% endif %}
        ★
    </button>
        </form>
        
        <!-- Contenu textuel interactif -->
        <div id="card-content" style="cursor: pointer;" onclick="toggleAnswer()">
            <div id="recto-text" style="font-size: 1.8em; font-weight: bold; text-transform: uppercase;">
                {{ card.question }}
            </div>
            <div id="verso-text" style="font-size: 1.5em; color: #4a5568; margin-top: 20px; display: none; border-top: 2px dashed #cbd5e0; padding-top: 15px;">
                {{ card.answer }}
            </div>
            
            <p id="hint" style="color: #718096; font-size: 0.85em; margin-top: 30px; font-style: italic;">Retourne la carte en cliquant dessus</p>
        </div>
    </div>

    <!-- BOUTONS DE SÉLECTION -->
    <div style="display: flex; gap: 15px; margin-top: 20px;">
    <form method="POST" style="flex: 1;">
        <input type="hidden" name="knows" value="0">
        <button type="submit" style="background: rgba(229, 62, 62, 0.1); border: 2px solid #e53e3e; color: #e53e3e; padding: 20px 10px; border-radius: 15px; width: 100%; font-size: 1.2em; font-weight: bold; cursor: pointer;">
            Je sais pas
        </button>
    </form>

    <form method="POST" style="flex: 1;">
        <input type="hidden" name="knows" value="1">
        <button type="submit" style="background: rgba(56, 161, 105, 0.1); border: 2px solid #38a169; color: #38a169; padding: 20px 10px; border-radius: 15px; width: 100%; font-size: 1.2em; font-weight: bold; cursor: pointer;">
            Je sais
        </button>
    </form>
</div>
</div>

<script>
function toggleAnswer() {
    var verso = document.getElementById("verso-text");
    var hint = document.getElementById("hint");
    if (verso.style.display === "none") {
        verso.style.display = "block";
        hint.style.display = "none";
    } else {
        verso.style.display = "none";
        hint.style.display = "block";
    }
}
</script>
{% endblock %}
